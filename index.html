<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    // Aplica el tema guardado antes del primer renderizado (evita parpadeo). Por defecto: oscuro.
    (function () {
      var t = 'dark';
      try { if (localStorage.getItem('theme') === 'light') t = 'light'; } catch (e) {}
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="header">
    <h1 class="title" aria-label="Tetris">
      <span style="--c:var(--piece-1)">T</span><span style="--c:var(--piece-2)">E</span><span style="--c:var(--piece-3)">T</span><span style="--c:var(--piece-4)">R</span><span style="--c:var(--piece-5)">I</span><span style="--c:var(--piece-7)">S</span>
    </h1>
    <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false">
      <span class="theme-toggle-label">Tema claro</span>
      <span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-thumb"></span></span>
    </button>
    </div>

    <div class="game">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <p id="overlay-title">TETRIS</p>
        <p id="overlay-score"></p>
        <form id="name-form" class="name-form hidden">
          <label for="name-input">Nuevo récord. Tu nombre:</label>
          <input id="name-input" type="text" maxlength="12" autocomplete="off" required />
          <button id="save-btn" type="submit">Guardar</button>
        </form>
        <div id="scores-section" class="scores hidden">
          <span class="label">MEJORES PUNTUACIONES</span>
          <table id="scores-table">
            <thead><tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Combo</th></tr></thead>
            <tbody id="scores-body"></tbody>
          </table>
          <p id="scores-stats" class="stats"></p>
        </div>
        <button id="play-btn">Jugar</button>
        <button id="restart-btn" class="hidden">Reiniciar</button>
        <button id="clear-btn" class="link-btn hidden" type="button">Borrar records</button>
      </div>
    </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
