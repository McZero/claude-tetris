<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    // Aplica el tema guardado antes del primer renderizado (evita parpadeo). Por defecto: oscuro.
    (function () {
      var t = 'dark';
      try { if (localStorage.getItem('theme') === 'light') t = 'light'; } catch (e) {}
      document.documentElement.dataset.theme = t;
      var s = 'retro';
      try { var ss = localStorage.getItem('skin'); if (ss === 'neon' || ss === 'pastel' || ss === 'pixel') s = ss; } catch (e) {}
      document.documentElement.dataset.skin = s;
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="header">
    <h1 class="title" aria-label="Tetris">
      <span style="--c:var(--piece-1)">T</span><span style="--c:var(--piece-2)">E</span><span style="--c:var(--piece-3)">T</span><span style="--c:var(--piece-4)">R</span><span style="--c:var(--piece-5)">I</span><span style="--c:var(--piece-7)">S</span>
    </h1>
    <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false">
      <span class="theme-toggle-label">Tema claro</span>
      <span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-thumb"></span></span>
    </button>
    <label class="skin-picker">
      <span class="skin-label">Skin</span>
      <select id="skin-select">
        <option value="retro">Retro</option>
        <option value="neon">Neon</option>
        <option value="pastel">Pastel</option>
        <option value="pixel">Pixel art</option>
      </select>
    </label>
    </div>

    <div class="game">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box pause-box">
        <p id="pause-title">PAUSA</p>
        <button type="button" id="resume-btn" class="menu-btn">Reanudar</button>
        <button type="button" id="pause-restart-btn" class="menu-btn">Reiniciar</button>
        <button type="button" id="controls-btn" class="menu-btn" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
        <ul id="pause-controls" class="pause-controls" hidden>
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
        </ul>
        <label class="level-select">
          <span>Nivel inicial</span>
          <select id="start-level"></select>
        </label>
        <p class="menu-hint">Se aplica al reiniciar</p>
      </div>
    </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
